[package]
name = "codex-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"

[dependencies]
processkit = "3.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
